name: CI

on:
  # push limité à main : sur une branche avec PR, seul pull_request déclenche.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Mêmes cibles qu'en local ; PY pointe vers le Python de setup-python.
      - run: make install PY="${{ steps.setup-python.outputs.python-path }}"
      - run: make lint
      - run: make test

  integration:
    needs: lint-and-unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: make install PY="${{ steps.setup-python.outputs.python-path }}"
      # Dépendance système de l'OCR (images d'avis de virement).
      - name: Installer Tesseract (OCR)
        run: |
          # Retentes apt : coupures passagères des miroirs Ubuntu vues sur les runners.
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng
          tesseract --version

      # Étapes de make pipeline, une par cible pour les voir séparément dans Actions.
      - name: Démarrer S3 (RustFS)
        run: make s3-up
      - name: Démarrer Postgres
        run: make db-up
      # Modèle SLM conservé entre deux runs : seul le premier le télécharge.
      - name: Cache du modèle SLM
        uses: actions/cache@v4
        with:
          path: .ollama/models
          key: ollama-models-qwen3.5-0.8b-v2
      - name: Démarrer Ollama (SLM)
        run: make slm-up
      - name: Récupérer le modèle SLM
        run: make slm-pull
      - name: Créer le bucket
        run: make s3-init
      - name: Générer les CSV (zone de dépôt locale)
        run: make generate
      - name: Générer les images d'avis de virement (OCR)
        run: make generate-images
      - name: Générer les textes en langage naturel (SLM)
        run: make generate-texts
      - name: Upload des CSV, des images et des textes vers S3
        run: make s3-upload
      - name: Vérifier la présence des objets dans S3
        run: make s3-verify
      - name: Initialiser le schéma
        run: make db-init
      - name: Lancer la pipeline (lecture depuis S3)
        run: make run
      - name: Relancer make pipeline (rejouable, rien de réinséré)
        run: make pipeline

      - run: make test-integration
      # Base vidée puis 2 pannes simulées : logs de retry visibles dans Actions.
      - name: Démo retry (2 pannes puis succès)
        run: make demo-retry
      - name: Démo retry S3 (2 pannes de téléchargement puis succès)
        run: make demo-s3-retry
      # Conteneur S3 réellement arrêté puis redémarré pendant que la pipeline tourne.
      - name: Démo panne S3 réelle (arrêt puis redémarrage du conteneur)
        run: make demo-s3-outage

      - name: Arrêter tous les services (Postgres, S3, Ollama)
        if: always()
        run: make db-down
