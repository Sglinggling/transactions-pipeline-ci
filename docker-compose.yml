services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Stockage objet compatible S3 (RustFS, version épinglée).
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-pipeline}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-pipelinesecret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "${S3_PORT:-9000}:9000" # API S3
      - "${S3_CONSOLE_PORT:-9001}:9001" # console web
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  # SLM local (Ollama, version épinglée). Seuls les modèles sont stockés sur
  # l'hôte (OLLAMA_MODELS_DIR), pour pouvoir être mis en cache en CI ; la clé
  # privée d'Ollama (root, 0600, illisible par le cache CI) reste dans le conteneur.
  ollama:
    image: ollama/ollama:0.40.15
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MODELS: /models
    ports:
      - "${SLM_PORT:-11434}:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR:-./.ollama/models}:/models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  s3data:
